name: Gate20 holdings CSV status hotfix

on:
  push:
    branches:
      - openhands/p0-runtime-api-key-fingerprint-proof

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.head_commit.message == 'chore: run Gate20 holdings CSV status hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openhands/p0-runtime-api-key-fingerprint-proof
          fetch-depth: 0

      - name: Apply exact Gate 20 status fix and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('app/streamlit_ui.py')
          text = ui.read_text(encoding='utf-8')
          old = '''    if status is None:\n        status = "ready" if surface is not None and not warnings else "unavailable"\n'''
          new = '''    if status is None:\n        if section == "holdings":\n            status = "ready" if bool(getattr(response, "holdings", ())) else "unavailable"\n        else:\n            status = "ready" if surface is not None and not warnings else "unavailable"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one status fallback block, found {text.count(old)}')
          ui.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_download_api.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_holdings_csv_preserves_ready_status_with_unrelated_warnings():'
          if marker not in test_text:
              test_text += '''\n\n\ndef test_holdings_csv_preserves_ready_status_with_unrelated_warnings():\n    from app.streamlit_ui import _section_export_metadata, build_section_csv_artifact\n\n    response = CcassResponse(\n        metadata=SourceMetadata(\n            code="00005",\n            name="HSBC HOLDINGS PLC",\n            issue_id=1,\n            holdings_date=date(2026, 9, 11),\n            fetched_at=datetime(2026, 9, 14, tzinfo=UTC),\n            source_url="longbridge://mcp/broker_holding_detail",\n            source_name="Longbridge",\n        ),\n        holdings_summary=HoldingsSummary(participant_count=1),\n        holdings=[\n            {\n                "rank": 1,\n                "participant_id": "P1",\n                "participant": "Alpha Holdings",\n                "shares": 1234,\n                "last_change": None,\n                "pct_of_issued": 1.2345,\n                "pct_of_ccass": 2.3456,\n                "cumulative_pct_of_issued": 1.2345,\n                "participant_category": "Nominee",\n            }\n        ],\n        data_quality_warnings=[\n            "DATA_LIMITATION: STOCK_EVENTS_UNAVAILABLE: supplementary events were skipped"\n        ],\n    )\n\n    csv_bytes, _ = build_section_csv_artifact(response, "holdings")\n    csv_text = csv_bytes.decode("utf-8-sig")\n    assert "section_status" in csv_text.splitlines()[0]\n    assert ",ready," in csv_text.splitlines()[1]\n    assert "STOCK_EVENTS_UNAVAILABLE" in csv_text\n\n    unavailable = response.model_copy(update={"holdings": []})\n    assert _section_export_metadata(unavailable, "holdings")["section_status"] == "unavailable"\n'''
              tests.write_text(test_text, encoding='utf-8')
          PY

      - name: Install project
        run: python -m pip install -e .

      - name: Run targeted regression
        run: python -m pytest -q tests/test_download_api.py -k 'holdings_csv_preserves_ready_status_with_unrelated_warnings or canonical_download_api_routes_stream_expected_artifacts'

      - name: Verify diff is scoped
        run: |
          git diff --check
          git diff -- app/streamlit_ui.py tests/test_download_api.py

      - name: Commit minimal fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Joe CCASS Gate20 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gate20_holdings_csv_status_hotfix.yml
          git add app/streamlit_ui.py tests/test_download_api.py
          git diff --cached --check
          git commit -m "fix: preserve holdings status in csv export"
          git push origin HEAD:openhands/p0-runtime-api-key-fingerprint-proof
