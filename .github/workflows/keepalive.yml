name: keepalive

# Free-tier services sleep after ~15 min idle; a ping every 10 minutes keeps
# the API warm for the HKT trading day. ~0.1 min per run ≈ well inside the
# private-repo Actions minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -s -o /dev/null -w "health %{http_code}\n" "https://joe-ccass-api.onrender.com/health"
