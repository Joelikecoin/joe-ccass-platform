name: Gate20 contract regression

on:
  push:
    branches:
      - openhands/p0-runtime-api-key-fingerprint-proof

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openhands/p0-runtime-api-key-fingerprint-proof
          fetch-depth: 0

      - name: Align regression with canonical PlatformError contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_download_api.py')
          text = p.read_text(encoding='utf-8')
          old = 'assert unsupported_schema.json()["code"] == "SCHEMA_VERSION_UNSUPPORTED"'
          new = 'assert unsupported_schema.json()["error_code"] == "SCHEMA_VERSION_UNSUPPORTED"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale schema error assertion, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run Gate 20 download contract regression
        run: python -m pytest -q tests/test_download_api.py

      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- tests/test_download_api.py

      - name: Commit regression alignment and remove workflow
        shell: bash
        run: |
          git config user.name "Joe CCASS Gate20 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gate20_contract_regression.yml
          git add tests/test_download_api.py
          git diff --cached --check
          git commit -m "test: align Gate20 schema error contract"
          git push origin HEAD:openhands/p0-runtime-api-key-fingerprint-proof
