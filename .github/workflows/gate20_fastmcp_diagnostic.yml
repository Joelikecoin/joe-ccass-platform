name: Gate20 FastMCP wrapper diagnostic

on:
  push:
    branches:
      - openhands/p0-runtime-api-key-fingerprint-proof

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openhands/p0-runtime-api-key-fingerprint-proof
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Inspect FastMCP wrapper
        shell: bash
        run: |
          python - <<'PY'
          import fastmcp
          from app import mcp_server
          tool = mcp_server.get_download_artifact
          print('FASTMCP_VERSION=', getattr(fastmcp, '__version__', 'unknown'))
          print('TOOL_TYPE=', type(tool))
          print('TOOL_CALLABLE=', callable(tool))
          print('TOOL_ATTRS=', [x for x in dir(tool) if x in {'fn','run','function','wrapped','call','name'}])
          x = getattr(tool, 'fn', None)
          print('FN_TYPE=', type(x))
          print('FN_CALLABLE=', callable(x))
          print('FN_ATTRS=', [a for a in dir(x) if a in {'fn','run','function','wrapped','call','name'}] if x is not None else [])
          y = getattr(x, 'fn', None) if x is not None else None
          print('FN_FN_TYPE=', type(y))
          print('FN_FN_CALLABLE=', callable(y))
          print('RUN_TYPE=', type(getattr(tool, 'run', None)))
          print('RUN_CALLABLE=', callable(getattr(tool, 'run', None)))
          PY

      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name "Joe CCASS Gate20 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gate20_fastmcp_diagnostic.yml
          git commit -m "chore: remove FastMCP diagnostic workflow"
          git push origin HEAD:openhands/p0-runtime-api-key-fingerprint-proof
