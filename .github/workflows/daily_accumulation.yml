name: daily-accumulation

# Evidence-cache accumulation: a rotating 13-stock slice of the watchlist
# gets DI + announcements + fundamentals + intelligence-events rebuilt each
# day (full 52-stock coverage every ~4 days). Runs after the CCASS snapshot.
on:
  schedule:
    - cron: "45 0 * * 1-5" # 08:45 HKT weekdays, after the snapshot workflow
  workflow_dispatch: {}

env:
  BASE_URL: https://joe-ccass-api.onrender.com

jobs:
  accumulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wake the free-tier service
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/health" || true)
            echo "warm attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "service did not warm up"
          exit 1

      - name: Trigger the accumulation job (13-stock slice)
        id: trigger
        run: |
          RESP=$(curl -s -X POST "$BASE_URL/admin/accumulation/job?key=${{ secrets.API_KEY }}")
          echo "trigger: $RESP"
          JOB=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('job_id',''))")
          if [ -z "$JOB" ]; then echo "no job_id returned"; exit 1; fi
          echo "job_id=$JOB" >> "$GITHUB_OUTPUT"

      - name: Poll to completion
        run: |
          for i in $(seq 1 90); do
            BODY=$(curl -s "$BASE_URL/admin/accumulation/job/${{ steps.trigger.outputs.job_id }}?key=${{ secrets.API_KEY }}")
            STATE=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('state',''))")
            echo "poll $i: $(echo "$BODY" | head -c 400)"
            case "$STATE" in
              running) sleep 30 ;;
              error) echo "accumulation job failed"; exit 1 ;;
              *) echo "terminal state: $STATE"; exit 0 ;;
            esac
          done
          echo "job still running after the polling window"
          exit 1
