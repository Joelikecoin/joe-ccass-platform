name: Gate20 MCP root fix

on:
  push:
    branches:
      - openhands/p0-runtime-api-key-fingerprint-proof

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openhands/p0-runtime-api-key-fingerprint-proof
          fetch-depth: 0

      - name: Apply minimal MCP registration fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/mcp_server.py')
          text = p.read_text(encoding='utf-8')
          old_loop = '''\n\nfor _tool in (\n    get_ccass_stock_data,\n    get_stock_summary,\n    get_holdings,\n    get_price_history,\n    get_snapshot_history,\n    get_snapshot_history_snapshots,\n    get_changes,\n    get_big_changes,\n    get_concentration,\n    get_rainbow_data,\n    get_announcements,\n    get_full_report,\n    get_source_status,\n    get_download_artifact,\n    get_raw_previews,\n    get_officers,\n    get_stock_events,\n    get_capital_information,\n    get_ai_read_model,\n):\n    setattr(_tool, "fn", _tool)\n'''
          if text.count(old_loop) != 1:
              raise SystemExit(f'compatibility self-fn loop count={text.count(old_loop)}')
          text = text.replace(old_loop, '')
          old_rainbow = '        rainbow_payload = await get_rainbow_data(code)\n'
          new_rainbow = '''        rainbow_callable = getattr(get_rainbow_data, "fn", get_rainbow_data)\n        rainbow_payload = await rainbow_callable(code)\n'''
          if text.count(old_rainbow) != 1:
              raise SystemExit(f'rainbow internal call count={text.count(old_rainbow)}')
          text = text.replace(old_rainbow, new_rainbow)
          p.write_text(text, encoding='utf-8')

          t = Path('tests/test_download_api.py')
          test_text = t.read_text(encoding='utf-8')
          old_assert = 'assert unsupported_schema.json()["code"] == "SCHEMA_VERSION_UNSUPPORTED"'
          new_assert = 'assert unsupported_schema.json()["error_code"] == "SCHEMA_VERSION_UNSUPPORTED"'
          if old_assert in test_text:
              test_text = test_text.replace(old_assert, new_assert)
          t.write_text(test_text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Verify FastMCP tool shape
        shell: bash
        run: |
          python - <<'PY'
          from app import mcp_server
          names = (
              'get_holdings','get_changes','get_snapshot_history',
              'get_snapshot_history_snapshots','get_download_artifact','get_raw_previews'
          )
          for name in names:
              tool = getattr(mcp_server, name)
              if not callable(getattr(tool, 'fn', None)):
                  raise SystemExit(f'{name}.fn is not callable: {type(getattr(tool, "fn", None))}')
              if getattr(tool, 'fn') is tool:
                  raise SystemExit(f'{name}.fn self-reference remains')
          print('MCP_TOOL_SHAPE=PASS')
          PY

      - name: Run Gate 20 API MCP export regression
        run: python -m pytest -q tests/test_download_api.py

      - name: Compile affected modules
        run: python -m compileall -q app/mcp_server.py app/streamlit_ui.py app/portal_8504.py app/api.py

      - name: Verify scoped diff
        run: |
          git diff --check
          git diff -- app/mcp_server.py tests/test_download_api.py

      - name: Commit root fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Joe CCASS Gate20 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gate20_mcp_root_fix.yml
          git add app/mcp_server.py tests/test_download_api.py
          git diff --cached --check
          git commit -m "fix: restore FastMCP callable tool contract"
          git push origin HEAD:openhands/p0-runtime-api-key-fingerprint-proof
