name: Gate20 FastMCP run result shape

on:
  push:
    branches:
      - openhands/p0-runtime-api-key-fingerprint-proof

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openhands/p0-runtime-api-key-fingerprint-proof
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Inspect supported FunctionTool.run result
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          from types import SimpleNamespace
          from app import mcp_server

          class FixtureService:
              async def get_stock_data(self, code, holdings_limit=15):
                  return SimpleNamespace(model_dump=lambda mode='json': {
                      'code': code, 'holdings_limit': holdings_limit, 'kind': 'summary'
                  })

          mcp_server.get_ccass_service = lambda: FixtureService()
          result = asyncio.run(mcp_server.get_holdings.run({'code':'01592','holdings_limit':17}))
          print('RESULT_TYPE=', type(result))
          attrs = [a for a in dir(result) if a in {'data','structured_content','content','result','value','is_error'}]
          print('RESULT_ATTRS=', attrs)
          for a in attrs:
              try:
                  value = getattr(result, a)
                  print(a.upper(), '_TYPE=', type(value), sep='')
                  print(a.upper(), '=', repr(value), sep='')
              except Exception as exc:
                  print(a.upper(), '_ERROR=', type(exc).__name__, str(exc), sep='')
          print('RESULT_REPR=', repr(result))
          PY

      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name "Joe CCASS Gate20 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gate20_fastmcp_run_shape.yml
          git commit -m "chore: remove FastMCP run-shape diagnostic"
          git push origin HEAD:openhands/p0-runtime-api-key-fingerprint-proof
