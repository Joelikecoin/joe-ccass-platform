name: Gate20 FastMCP minimal compare

on:
  push:
    branches:
      - openhands/p0-runtime-api-key-fingerprint-proof

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openhands/p0-runtime-api-key-fingerprint-proof
          fetch-depth: 0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare clean FastMCP decorator with repo tool
        shell: bash
        run: |
          python - <<'PY'
          from fastmcp import FastMCP
          clean = FastMCP('clean')
          @clean.tool
          async def ping(x: int) -> dict:
              return {'x': x}
          print('CLEAN_TYPE=', type(ping))
          print('CLEAN_FN_TYPE=', type(getattr(ping,'fn',None)))
          print('CLEAN_FN_CALLABLE=', callable(getattr(ping,'fn',None)))
          from app import mcp_server
          tool = mcp_server.get_holdings
          print('REPO_TYPE=', type(tool))
          print('REPO_FN_TYPE=', type(getattr(tool,'fn',None)))
          print('REPO_FN_CALLABLE=', callable(getattr(tool,'fn',None)))
          PY
      - name: Remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          git config user.name "Joe CCASS Gate20 Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/gate20_fastmcp_minimal_compare.yml
          git commit -m "chore: remove FastMCP minimal compare"
          git push origin HEAD:openhands/p0-runtime-api-key-fingerprint-proof
